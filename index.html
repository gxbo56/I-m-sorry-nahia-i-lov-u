<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para mi peque 💗</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CORAZONES DE FONDO -->

    <div class="hearts">
        <span>💗</span>
        <span>💕</span>
        <span>💗</span>
        <span>💖</span>
        <span>💕</span>
        <span>💗</span>
    </div>


    <!-- PANTALLA PRINCIPAL -->

    <main class="card" id="mainCard">

        <div class="emoji">
            🥺
        </div>

        <h1>
            ¿Me perdonas,<br>
            mi peque 🥺💗?
        </h1>

        <p class="subtitle">
            Tengo algo que decirte...
        </p>


        <div class="buttons">

            <button id="yesButton">
                Sí 💗
            </button>

            <button id="noButton">
                No 😭
            </button>

        </div>

    </main>


    <!-- PANTALLA FINAL -->

    <main class="card success hidden" id="successCard">

        <div class="emoji big">
            🥹💗
        </div>

        <h1>
            ¡SABÍA QUE DIRÍAS QUE SÍ!
        </h1>

        <p>
            Te amo muchísimo, mi peque.
            Gracias por perdonarme 🥺💗
        </p>

        <div class="final-hearts">
            💗 💕 💖 💕 💗
        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
